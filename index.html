
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Brelo</title>
      <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
      <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
      <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
      <meta name="theme-color" content="#178A4C" />
      <meta name="description" content="Brelo — freight dispatch management platform with real-time tracking, driver management, and load operations." />
      <meta name="robots" content="noindex, nofollow" />
      <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
      <script>
        // Apply the stored (or system) theme before first paint, so there's no
        // light-mode flash for a user who has dark mode saved.
        (function () {
          try {
            var t = localStorage.getItem("theme");
            var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
            if (dark) document.documentElement.classList.add("dark");
          } catch (e) {}
        })();
      </script>

    </head>

    <body>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
